<!DOCTYPE html>
<html lang="vi-VN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Yếu CREI 3D Particles</title>
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background: radial-gradient(circle at center, #1a1b41 0%, #05050a 100%); 
            font-family: sans-serif; color: white; 
        }
        #loading { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 18px; letter-spacing: 2px; color: #00ffff; 
            text-shadow: 0 0 10px #00ffff; z-index: 10; 
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
    
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">ĐANG TẢI DỮ LIỆU 3D... VUI LÒNG ĐỢI</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const loader = new GLTFLoader();

        // Biến điều chỉnh tỷ lệ nếu 2 file AI xuất ra bị chênh lệch kích thước
        const BUILDING_SCALE = 2.0; 
        const PEOPLE_SCALE = 1.0;

        // Thuật toán chuyển đổi Mesh thành Hệ thống hạt (Particles)
        function createParticlesFromMesh(gltf, scale, primaryColorHex, hasGoldAccents, offsetZ) {
            gltf.scene.traverse((child) => {
                if (child.isMesh) {
                    const positions = child.geometry.attributes.position;
                    const ptCount = positions.count;
                    
                    const ptsPos = new Float32Array(ptCount * 3);
                    const ptsCol = new Float32Array(ptCount * 3);
                    
                    const primaryColor = new THREE.Color(primaryColorHex);
                    const goldColor = new THREE.Color(0xffd700);

                    for(let i = 0; i < ptCount; i++) {
                        ptsPos[i*3] = positions.getX(i) * scale;
                        ptsPos[i*3+1] = positions.getY(i) * scale;
                        ptsPos[i*3+2] = positions.getZ(i) * scale + offsetZ;

                        let c = primaryColor;
                        if (hasGoldAccents && Math.random() > 0.85) c = goldColor;

                        ptsCol[i*3] = c.r;
                        ptsCol[i*3+1] = c.g;
                        ptsCol[i*3+2] = c.b;
                    }

                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.BufferAttribute(ptsPos, 3));
                    geo.setAttribute('color', new THREE.BufferAttribute(ptsCol, 3));

                    const mat = new THREE.PointsMaterial({
                        size: 0.05,
                        vertexColors: true,
                        transparent: true,
                        opacity: 0.8,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    const points = new THREE.Points(geo, mat);
                    
                    // Căn giữa mô hình
                    geo.computeBoundingBox();
                    const center = new THREE.Vector3();
                    geo.boundingBox.getCenter(center);
                    points.position.sub(center);
                    points.position.y += Math.abs(geo.boundingBox.min.y); 
                    
                    mainGroup.add(points);
                }
            });
        }

        // Tiến trình nạp file
        loader.load('models/building.glb', (gltf) => {
            createParticlesFromMesh(gltf, BUILDING_SCALE, 0x00ffff, true, 0); // Kính Cyan, dầm Vàng
            
            loader.load('models/people.glb', (gltfPeople) => {
                createParticlesFromMesh(gltfPeople, PEOPLE_SCALE, 0xffffff, false, 8); // Người trắng, đẩy ra phía trước 8 đơn vị
                document.getElementById('loading').style.display = 'none';
            }, undefined, () => alert("Không tìm thấy file models/people.glb"));

        }, undefined, () => {
            document.getElementById('loading').innerText = "LỖI: Không tìm thấy file models/building.glb";
        });

        // Tạo vòng quỹ đạo ánh sáng (Light Trails)
        const rings = [];
        const ringGeo = new THREE.TorusGeometry(10, 0.02, 8, 150);
        const matCyan = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.05, blending: THREE.AdditiveBlending });
        const matGold = new THREE.PointsMaterial({ color: 0xffd700, size: 0.05, blending: THREE.AdditiveBlending });

        for(let i=0; i<3; i++) {
            const pts = new THREE.Points(ringGeo, i % 2 === 0 ? matCyan : matGold);
            pts.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
            pts.position.y = 2 + i * 2;
            pts.scale.setScalar(1 + i * 0.2);
            mainGroup.add(pts);
            rings.push({ mesh: pts, speed: (Math.random() - 0.5) * 2 });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            rings.forEach(r => r.mesh.rotation.z += 0.01 * r.speed);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
